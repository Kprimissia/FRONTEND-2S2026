<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Quadro Kanban & Planejamento Ágil — Projeto Integrador ConsorTech (Aula 06)</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      background: #0f172a;
      color: #f8fafc;
      padding: 1.5rem;
    }
    header {
      max-width: 1320px;
      margin: 0 auto 1.5rem;
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 1rem;
      border-bottom: 1px solid #1e293b;
      padding-bottom: 1rem;
    }
    header h1 {
      font-size: 1.5rem;
      color: #38bdf8;
    }
    header p {
      font-size: 0.9rem;
      color: #94a3b8;
      margin-top: 0.25rem;
    }
    .sprint-filters {
      display: flex;
      gap: 0.5rem;
      flex-wrap: wrap;
    }
    .filter-btn {
      background: #1e293b;
      color: #cbd5e1;
      border: 1px solid #334155;
      padding: 0.45rem 0.9rem;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
      font-size: 0.82rem;
    }
    .filter-btn.active {
      background: #0284c7;
      color: #ffffff;
      border-color: #38bdf8;
    }
    .metrics-bar {
      max-width: 1320px;
      margin: 0 auto 1.5rem;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 1rem;
    }
    .metric-card {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 10px;
      padding: 1rem;
    }
    .metric-card span {
      font-size: 0.78rem;
      color: #94a3b8;
      text-transform: uppercase;
    }
    .metric-card strong {
      display: block;
      font-size: 1.4rem;
      color: #f8fafc;
      margin-top: 0.25rem;
    }
    .kanban-board {
      max-width: 1320px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 1rem;
    }
    @media (max-width: 1024px) {
      .kanban-board {
        grid-template-columns: repeat(2, 1fr);
      }
    }
    @media (max-width: 640px) {
      .kanban-board {
        grid-template-columns: 1fr;
      }
    }
    .kanban-column {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 12px;
      padding: 1rem;
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }
    .kanban-column h2 {
      font-size: 0.95rem;
      color: #e2e8f0;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 0.5rem;
      border-bottom: 1px solid #334155;
    }
    .task-card {
      background: #0f172a;
      border: 1px solid #334155;
      border-radius: 8px;
      padding: 0.85rem;
    }
    .task-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 0.4rem;
    }
    .task-id {
      font-family: monospace;
      font-size: 0.75rem;
      color: #38bdf8;
      font-weight: 700;
    }
    .sp-badge {
      background: rgba(56, 189, 248, 0.15);
      color: #38bdf8;
      font-size: 0.72rem;
      padding: 0.15rem 0.45rem;
      border-radius: 999px;
      font-weight: 700;
    }
    .task-title {
      font-size: 0.9rem;
      color: #f1f5f9;
      margin-bottom: 0.5rem;
      line-height: 1.35;
    }
    .task-meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.75rem;
      color: #94a3b8;
    }
    .move-btn {
      margin-top: 0.6rem;
      width: 100%;
      background: #334155;
      color: #f8fafc;
      border: none;
      padding: 0.35rem;
      border-radius: 6px;
      font-size: 0.75rem;
      cursor: pointer;
    }
    .move-btn:hover {
      background: #0284c7;
    }
  </style>
</head>
<body>
  <header>
    <div>
      <h1>Quadro Kanban — Projeto Integrador ConsorTech</h1>
      <p>Aula 06: Gestão Ágil de Projetos Front-End (User Stories, Story Points, Sprints e DoD)</p>
    </div>
    <div class="sprint-filters">
      <button class="filter-btn active" onclick="filterSprint('all', this)">Todas as Sprints</button>
      <button class="filter-btn" onclick="filterSprint('Sprint 1', this)">Sprint 1</button>
      <button class="filter-btn" onclick="filterSprint('Sprint 2', this)">Sprint 2</button>
      <button class="filter-btn" onclick="filterSprint('Sprint 3', this)">Sprint 3</button>
      <button class="filter-btn" onclick="filterSprint('Sprint 4', this)">Sprint 4</button>
    </div>
  </header>

  <section class="metrics-bar">
    <div class="metric-card">
      <span>Total de Tarefas</span>
      <strong id="total-tasks">10</strong>
    </div>
    <div class="metric-card">
      <span>Total Story Points</span>
      <strong id="total-sp">39 SP</strong>
    </div>
    <div class="metric-card">
      <span>Concluído (Done)</span>
      <strong id="done-sp">13 SP</strong>
    </div>
    <div class="metric-card">
      <span>Metodologia</span>
      <strong>Scrum + Kanban</strong>
    </div>
  </section>

  <main class="kanban-board" id="board"></main>

  <script>
    const columns = [
      { key: 'todo', label: '📌 To Do (A Fazer)' },
      { key: 'doing', label: '⚙️ In Progress' },
      { key: 'review', label: '🔍 Code Review / Test' },
      { key: 'done', label: '✅ Done (Pronto)' }
    ];

    const tasks = [
      { id: 'FE-01', us: 'US01', title: 'Estruturar projeto base, rotas protegidas e layout de autenticação', sp: 2, sprint: 'Sprint 1', status: 'done' },
      { id: 'FE-02', us: 'US01', title: 'Implementar formulário controlado de login e integração POST /auth/login', sp: 3, sprint: 'Sprint 1', status: 'done' },
      { id: 'FE-03', us: 'US02', title: 'Criar componente StatCard reutilizável e grid responsivo do Dashboard', sp: 2, sprint: 'Sprint 1', status: 'done' },
      { id: 'FE-04', us: 'US02', title: 'Integrar consumo de indicadores via fetch com estados de loading/erro', sp: 3, sprint: 'Sprint 1', status: 'done' },
      { id: 'FE-05', us: 'US03', title: 'Desenvolver componente FilterBar (busca textual + filtro por status)', sp: 3, sprint: 'Sprint 2', status: 'done' },
      { id: 'FE-06', us: 'US03', title: 'Construir tabela responsiva ContempladosTable com badges semânticos', sp: 5, sprint: 'Sprint 2', status: 'review' },
      { id: 'FE-07', us: 'US04', title: 'Criar modal de disparo de notificação e timeline de histórico', sp: 5, sprint: 'Sprint 3', status: 'doing' },
      { id: 'FE-08', us: 'US04', title: 'Integrar envio de comunicado (POST /comunicacoes) e atualizar estado', sp: 3, sprint: 'Sprint 3', status: 'doing' },
      { id: 'FE-09', us: 'US05', title: 'Implementar checklist documental interativo com bloqueio condicional', sp: 5, sprint: 'Sprint 3', status: 'todo' },
      { id: 'FE-10', us: 'US05', title: 'Implementar fluxo de confirmação de baixa (PUT /contemplados/:id/baixa)', sp: 8, sprint: 'Sprint 4', status: 'todo' }
    ];

    let activeSprint = 'all';

    function filterSprint(sprint, btn) {
      activeSprint = sprint;
      document.querySelectorAll('.filter-btn').forEach((b) => b.classList.remove('active'));
      btn.classList.add('active');
      renderBoard();
    }

    function advanceTask(id) {
      const order = ['todo', 'doing', 'review', 'done'];
      const task = tasks.find((t) => t.id === id);
      if (!task) return;
      const nextIndex = (order.indexOf(task.status) + 1) % order.length;
      task.status = order[nextIndex];
      renderBoard();
    }

    function renderBoard() {
      const filtered = activeSprint === 'all' ? tasks : tasks.filter((t) => t.sprint === activeSprint);
      const board = document.getElementById('board');
      board.innerHTML = '';

      document.getElementById('total-tasks').textContent = filtered.length;
      const totalSp = filtered.reduce((acc, t) => acc + t.sp, 0);
      const doneSp = filtered.filter((t) => t.status === 'done').reduce((acc, t) => acc + t.sp, 0);
      document.getElementById('total-sp').textContent = `${totalSp} SP`;
      document.getElementById('done-sp').textContent = `${doneSp} SP`;

      columns.forEach((col) => {
        const colTasks = filtered.filter((t) => t.status === col.key);
        const colEl = document.createElement('section');
        colEl.className = 'kanban-column';
        colEl.innerHTML = `<h2><span>${col.label}</span><span>${colTasks.length}</span></h2>`;

        colTasks.forEach((task) => {
          const card = document.createElement('article');
          card.className = 'task-card';
          card.innerHTML = `
            <div class="task-top">
              <span class="task-id">${task.id} • ${task.us}</span>
              <span class="sp-badge">${task.sp} SP</span>
            </div>
            <p class="task-title">${task.title}</p>
            <div class="task-meta">
              <span>${task.sprint}</span>
              <span>Must Have</span>
            </div>
            <button class="move-btn" onclick="advanceTask('${task.id}')">Avançar Etapa ➔</button>
          `;
          colEl.appendChild(card);
        });

        board.appendChild(colEl);
      });
    }

    renderBoard();
  </script>
</body>
</html>
